<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Power a City — From Source to Streetlight. A teacher-led lesson about how electricity reaches a neighborhood and what keeps it available." />
    <meta name="theme-color" content="#14213d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2314213d'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23ffc93c'/%3E%3C/svg%3E" />
    <title>Power a City — From Source to Streetlight</title>
  </head>
  <body>
    <a class="skip-link" href="#dock">Skip to lesson controls</a>
    <div id="app" class="app">
      <header class="topbar">
        <p class="brand"><span class="brand-mark" aria-hidden="true">⚡</span> Power a City <span class="brand-sub">From Source to Streetlight</span></p>
        <nav class="top-actions" aria-label="Tools" id="top-actions"></nav>
      </header>

      <div id="stage" class="stage">
        <aside id="card" class="card-panel" aria-labelledby="card-title" hidden></aside>
      </div>

      <main id="dock" class="dock" tabindex="-1" hidden></main>

      <div id="notice" class="toast" role="status" hidden></div>

      <section id="loading" class="loading" aria-live="polite" hidden>
        <p>Loading the neighborhood…</p>
      </section>

      <section id="entry" class="entry" aria-labelledby="entry-title"></section>
    </div>

    <dialog id="settings" class="dialog" aria-labelledby="settings-title"></dialog>

    <section id="boot-error" class="boot-error" role="alert" hidden>
      <div class="boot-error-box">
        <h1>Power a City couldn’t start in this browser</h1>
        <p>Try opening the same link in an up-to-date Chrome or Edge, or on a laptop connected to the board.</p>
        <p class="boot-error-detail" id="boot-error-detail"></p>
        <p class="boot-error-detail" id="boot-error-ua"></p>
      </div>
    </section>
    <noscript>Power a City needs JavaScript. Ask your teacher for the printable guide.</noscript>
    <script>
      // Plain, old-browser-safe script: if the app hasn't started within 15 s, explain why instead of showing a blank screen.
      (function () {
        var lastError = '';
        window.addEventListener('error', function (e) {
          var msg = String(e.message || '');
          if (msg.indexOf('import.meta') !== -1) return;
          lastError = 'Error: ' + msg + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
        });
        setTimeout(function () {
          if (document.documentElement.getAttribute('data-booted')) return;
          var box = document.getElementById('boot-error');
          if (!box) return;
          box.hidden = false;
          document.getElementById('boot-error-detail').textContent = lastError || 'The app did not finish starting.';
          document.getElementById('boot-error-ua').textContent = 'Browser: ' + navigator.userAgent;
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
